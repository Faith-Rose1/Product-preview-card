<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product preview card</title>
  <link rel="icon" href="./images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <article class="product-card">
      <picture>
        <source media="(width >= 37.5rem)" srcset="./images/image-product-desktop.jpg">

        <img src="./images/image-product-mobile.jpg" alt="picture of Gabrielle Essence Eau De Parfum bottle" class="product-img">
      </picture>

      <div class="product-content">
        <p class="product-category">PERFUME</p>

        <h1>Gabrielle Essence Eau De Parfum</h1>

        <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

        <div class="product-price">
          <span class="updated-price">$149.99</span>
          <span class="original-price"><s>$169.99</s></span>
        </div>

        <button type="button">
          <img src="./images/icon-cart.svg" alt="">

          Add to Cart
        </button>
      </div>
    </article>
  </main>
</body>
</html>
